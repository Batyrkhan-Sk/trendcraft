#cloud-config
# Bootstrap for an Oracle Cloud Always Free ARM instance (VM.Standard.A1.Flex).
# Paste this into "Advanced options → Cloud-init script" when launching, or run
# the equivalent commands by hand on any fresh Ubuntu box.
#
# Tested against Ubuntu 24.04 (aarch64).

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - git
  - gnupg
  - ufw

write_files:
  # Oracle's Ubuntu images ship an iptables ruleset that drops everything except
  # SSH, and it survives reboots via netfilter-persistent. Opening ports in the
  # VCN security list alone is NOT enough — this is the single most common reason
  # a correctly-deployed OCI service appears unreachable.
  - path: /etc/trendcraft/open-web-ports.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      iptables -I INPUT 5 -p tcp --dport 80  -j ACCEPT -m comment --comment "http"
      iptables -I INPUT 6 -p tcp --dport 443 -j ACCEPT -m comment --comment "https"
      # Pre-answer the iptables-persistent debconf prompts; declining them
      # discards these rules on the next reboot.
      export DEBIAN_FRONTEND=noninteractive
      if ! command -v netfilter-persistent >/dev/null 2>&1; then
        echo 'iptables-persistent iptables-persistent/autosave_v4 boolean true' | debconf-set-selections
        echo 'iptables-persistent iptables-persistent/autosave_v6 boolean true' | debconf-set-selections
        apt-get install -y -qq iptables-persistent || true
      fi
      netfilter-persistent save || true

runcmd:
  # --- Docker Engine + Compose plugin, from Docker's own repository ---
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - >
    echo "deb [arch=$(dpkg --print-architecture)
    signed-by=/etc/apt/keyrings/docker.asc]
    https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable"
    > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker
  - usermod -aG docker ubuntu

  # --- Firewall: iptables (Oracle) and ufw, so either path works ---
  - /etc/trendcraft/open-web-ports.sh
  - ufw allow OpenSSH
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable

  # --- Swap. The free ARM shape has plenty of RAM, but `next build` is memory
  #     hungry and a swap file is cheap insurance against an OOM mid-build. ---
  - fallocate -l 4G /swapfile
  - chmod 600 /swapfile
  - mkswap /swapfile
  - swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab

  # --- Unattended security updates ---
  - apt-get install -y unattended-upgrades
  - dpkg-reconfigure -f noninteractive unattended-upgrades

  - mkdir -p /opt/trendcraft /opt/trendcraft-backups
  - chown -R ubuntu:ubuntu /opt/trendcraft /opt/trendcraft-backups

final_message: "TrendCraft host ready after $UPTIME seconds. Clone the repo into /opt/trendcraft."
